name: Android Build

# Builds the Capacitor Android app: always a debug APK, plus a signed release
# AAB when signing secrets are configured. Artifacts are uploaded to the run.
#
# To produce a signed AAB in CI, add these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#                                base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias (e.g. "upload")
#   ANDROID_KEY_PASSWORD       key password
# Without them, the release steps are skipped and only the debug APK is built.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "website/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapping the secrets to env lets the release steps gate on their presence
      # (secrets can't be referenced directly in step-level `if:` conditions).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Unique, increasing versionCode per run so Play uploads never collide.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        working-directory: website
        run: npm ci

      - name: Build web app + sync Capacitor
        working-directory: website
        run: npm run android:sync

      - name: Build debug APK
        working-directory: website/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: website/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: website/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: website/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: website/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Clean up signing material
        if: ${{ always() }}
        working-directory: website/android
        run: rm -f keystore.properties "$RUNNER_TEMP/upload-keystore.jks"
